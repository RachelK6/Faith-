server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 520m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host;
                   proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header X-Real-IP $remote_addr;
                   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /admin/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /static/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  # Only public assets. submissions/ and lesson_resources/ are private and are
  # served by authenticated API endpoints, never straight from disk.
  location /media/course_covers/ { alias /media/course_covers/; }
  location /media/ { return 404; }
  location / { try_files $uri /index.html; }   # React Router
}
